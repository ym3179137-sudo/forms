<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ixl-solver</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <!-- ─── login screen ───────────────────────────────────────── -->
    <div class="login-wrap" id="screen-login">
        <div class="login-card">
            <h1>ixl-solver</h1>
            <p class="sub" id="boot-msg">sign in to continue.</p>

            <div id="login-box">
                <label>
                    username
                    <input type="text" id="user-input" autocomplete="username" />
                </label>
                <label>
                    password
                    <input type="password" id="pass-input" autocomplete="current-password" />
                </label>
                <button id="login-submit" type="button">Sign in</button>
            </div>

            <div id="error-box" class="err" hidden></div>
        </div>
    </div>

    <!-- ─── browser screen ─────────────────────────────────────── -->
    <div class="browser" id="screen-session" hidden>

        <div class="toolbar">
            <button class="tb-btn" id="nav-back" title="Back">◀</button>
            <button class="tb-btn" id="nav-forward" title="Forward">▶</button>
            <button class="tb-btn" id="nav-reload" title="Reload">⟳</button>
            <input class="tb-url" id="nav-url" type="text" placeholder="https://www.ixl.com/" spellcheck="false" />
            <button class="tb-btn" id="nav-go" title="Go">→</button>
            <div class="tb-spacer"></div>
            <span class="view-status" id="viewer-status">connecting…</span>
            <button class="tb-btn danger" id="stop-btn" title="Stop">Stop</button>
            <button class="tb-btn" id="fs-btn" title="Fullscreen">⛶</button>
            <button class="tb-btn" id="back-btn" title="Exit">✕</button>
        </div>

        <div class="viewport" id="viewer-wrap">
            <canvas id="viewer" width="1920" height="1080"></canvas>
        </div>

        <div class="statusbar">
            <span id="session-id"></span>
            <span class="sess-status" id="status">connecting…</span>
        </div>

    </div>

    <script src="/app.js"></script>
</body>

</html>
