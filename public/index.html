<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Arcade</title>
    <link rel="icon" type="image/png" href="/square_og_ixl.png" />
    <link rel="apple-touch-icon" href="/square_og_ixl.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <!-- login / signup -->
    <div class="login-wrap" id="screen-login">
        <div class="login-card">
            <h1>Study Arcade</h1>
            <p class="sub" id="boot-msg">sign in to continue</p>

            <div class="tabs">
                <button class="tab active" data-tab="login" type="button">LOGIN</button>
                <button class="tab" data-tab="signup" type="button">SIGN UP</button>
            </div>

            <div id="tab-login" class="tab-panel">
                <label>
                    username
                    <input type="text" id="user-input" autocomplete="username" />
                </label>
                <label>
                    password
                    <input type="password" id="pass-input" autocomplete="current-password" />
                </label>
                <button id="login-submit" type="button">START</button>
            </div>

            <div id="tab-signup" class="tab-panel hidden">
                <label>
                    username
                    <input type="text" id="signup-user" autocomplete="username" />
                </label>
                <label>
                    email (optional)
                    <input type="email" id="signup-email" autocomplete="email" />
                </label>
                <label>
                    password
                    <input type="password" id="signup-pass" autocomplete="new-password" />
                </label>
                <button id="signup-submit" type="button">CREATE ACCOUNT</button>
            </div>

            <div class="err" id="error-box"></div>
        </div>
    </div>

    <!-- launcher -->
    <main class="launcher-wrap hidden" id="screen-launcher">
        <h1 class="launcher-title">Study Arcade</h1>

        <div class="launcher-grid">
            <button class="launcher-btn" data-url="https://www.ixl.com/">
                <div class="launcher-icon" style="color:#1c4980;">IXL</div>
                <div class="launcher-label">IXL</div>
                <div class="launcher-desc">math, reading, science</div>
            </button>

            <button class="launcher-btn" data-url="https://wayground.com/">
                <div class="launcher-icon" style="color:#9b7dff;">⚡</div>
                <div class="launcher-label">WAYGROUND</div>
                <div class="launcher-desc">quizzes & review</div>
            </button>

            <button class="launcher-btn" data-url="https://www.blooket.com/">
                <div class="launcher-icon" style="color:#ff7b3d;">🎮</div>
                <div class="launcher-label">BLOOKET</div>
                <div class="launcher-desc">game-based review</div>
            </button>

            <button class="launcher-btn" data-url="https://docs.google.com/forms/">
                <div class="launcher-icon" style="color:#7ac143;">📝</div>
                <div class="launcher-label">FORMS</div>
                <div class="launcher-desc">google forms solver</div>
            </button>
        </div>

        <p class="unblock-label">▶ unblock any site</p>
        <div class="unblock-bar">
            <input type="text" id="unblock-input" placeholder="paste link or type e.g. youtube.com" autocomplete="off"
                spellcheck="false" />
            <button id="unblock-go" type="button">GO</button>
        </div>

        <footer class="launcher-foot">
            <span>each site signs in on its own page</span>
            <button class="ghost" id="logout-btn" type="button">LOGOUT</button>
        </footer>
    </main>

    <!-- VNC session -->
    <div class="session hidden" id="screen-session">
        <button class="back-btn" id="session-back" type="button">← back</button>
        <iframe id="vnc-frame" src="" allow="clipboard-read; clipboard-write"></iframe>
        <div class="panic-overlay" id="panic-overlay" hidden>
            <div class="panic-inner">
                <div class="panic-title">Google Classroom</div>
                <div class="panic-line"></div>
                <div class="panic-line short"></div>
                <div class="panic-line"></div>
                <div class="panic-line shorter"></div>
                <div class="panic-line"></div>
                <div class="panic-line"></div>
                <div class="panic-line short"></div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
