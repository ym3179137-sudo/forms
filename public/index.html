<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ixl-solver</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <div class="wrap">

        <section id="screen-login" class="screen">
            <h1>ixl-solver</h1>
            <p class="sub" id="boot-msg">sign in to continue.</p>

            <div id="login-box">
                <label>
                    username
                    <input type="text" id="user-input" autocomplete="username" />
                </label>
                <label>
                    password
                    <input type="password" id="pass-input" autocomplete="current-password" />
                </label>
                <button id="login-submit" type="button">Sign in</button>
            </div>

            <div id="error-box" class="status err" hidden></div>
        </section>

        <section id="screen-session" class="screen" hidden>
            <div class="session-head">
                <span class="session-id" id="session-id"></span>
                <span class="view-status" id="viewer-status">connecting…</span>
                <button id="stop-btn" type="button">Stop</button>
            </div>

            <div id="viewer-wrap">
                <canvas id="viewer" width="1366" height="768"></canvas>
            </div>

            <div class="status" id="status">connecting…</div>
            <div class="log" id="log"></div>

            <button id="back-btn" class="ghost" type="button">back to launcher</button>
        </section>

    </div>

    <script type="module" src="/app.js"></script>
</body>

</html>
