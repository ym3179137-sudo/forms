<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IXL — Chrome</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <div class="login-wrap" id="screen-login">
        <div class="login-card">
            <h1>ixl-solver</h1>
            <p class="sub" id="boot-msg">sign in to continue.</p>

            <div id="login-box">
                <label>
                    username
                    <input type="text" id="user-input" autocomplete="username" />
                </label>
                <label>
                    password
                    <input type="password" id="pass-input" autocomplete="current-password" />
                </label>
                <button id="login-submit" type="button">Sign in</button>
            </div>

            <div id="error-box" class="err" hidden></div>
        </div>
    </div>

    <div class="browser" id="screen-session" hidden>
        <div class="toolbar">
            <div class="tb-nav">
                <button class="tb-btn" id="nav-back" title="Back">←</button>
                <button class="tb-btn" id="nav-forward" title="Forward">→</button>
                <button class="tb-btn" id="nav-reload" title="Reload">⟳</button>
            </div>
            <div class="tb-address">
                <span class="tb-lock">🔒</span>
                <input class="tb-url" id="nav-url" type="text" placeholder="www.ixl.com" spellcheck="false" />
            </div>
            <div class="tb-right">
                <button class="tb-btn" id="ixl-login-btn" title="Auto-login IXL">🔑</button>
                <button class="tb-btn" id="fs-btn" title="Fullscreen (Ctrl+M)">⛶</button>
                <button class="tb-btn" id="back-btn" title="Exit">✕</button>
            </div>
        </div>

        <div class="viewport" id="viewer-wrap">
            <iframe id="vnc-frame" src="" allow="clipboard-read; clipboard-write"></iframe>
            <div class="panic-overlay" id="panic-overlay" hidden>
                <div class="panic-inner">
                    <div class="panic-title">Google Classroom</div>
                    <div class="panic-line"></div>
                    <div class="panic-line short"></div>
                    <div class="panic-line"></div>
                    <div class="panic-line shorter"></div>
                    <div class="panic-line"></div>
                </div>
            </div>
        </div>

        <div class="statusbar">
            <span id="session-id">live vnc</span>
            <span class="sess-status" id="status">connected</span>
            <span class="view-status" id="viewer-status">ready</span>
        </div>
    </div>

    <!-- IXL credentials popup -->
    <div class="ixl-modal" id="ixl-modal" hidden>
        <div class="ixl-modal-card">
            <h2>IXL Auto-Login</h2>
            <p class="sub">Save your IXL login. It will auto-fill whenever you open a session.</p>
            <label>
                IXL username or email
                <input type="text" id="ixl-email" autocomplete="off" />
            </label>
            <label>
                IXL password
                <input type="password" id="ixl-pass" autocomplete="off" />
            </label>
            <div class="ixl-modal-actions">
                <button class="ghost" id="ixl-skip" type="button">Skip</button>
                <button id="ixl-save" type="button">Save &amp; Log In</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
